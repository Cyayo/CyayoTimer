      - " &8- 5x <gradient:#FFE018:#FFFFFF:#FFE018>Bag of Gins</gradient>"
      - " &8- 2x <gradient:#740D91:#FF00E3:#E020E3>Bag of Runes</gradient>"
      - " &8- 1x <gradient:#870202:#FF00E3:#D50D0D>2x Luck 5m</gradient>"
      - " &8- 1x &dRune Extractor"
      - " &8- 1-3x <gradient:#A041FF:#414EFF>Item Protection Magic Jelly</gradient>"
      - " &8- 1x &4Astral Key"
      - " &8- 2-3x &7Rusty Key"
      - " &8- 3-5x &aMaterial Key"
    playtime-required: 720
    reset-message: "Hadiah Mingguan telah di reset"
    reset-sound: "ENTITY_EXPERIENCE_ORB_PICKUP;1.0;1.0"
    lore:
      cooldown: " &7Status Reset: %status%"
      playtime: " &7Waktu Main: %status%"
    actions:
      commands:
        - "phoenixc giveKey material %player% %random_3-5%"
        - "phoenixc giveKey astral %player% 1"
        - "phoenixc giveKey rusty %player% %random_2-3%"
      mmo-items:
