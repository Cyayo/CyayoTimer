# ==========================================
#        CyayoTimer - Konfigurasi Hadiah
# ==========================================
# Dikembangkan oleh Cyayo
# 
# PANDUAN FORMAT RESET-TYPE:
# ------------------------------------------
# reset-type: DAILY | WEEKLY | MONTHLY | NONE
# day: MONDAY | TUESDAY | WEDNESDAY | THURSDAY | FRIDAY | SATURDAY | SUNDAY | ALL
# (Gunakan 'day' jika ingin hadiah hanya bisa diambil di hari tertentu)
# 
# CONTOH HADIAH KHUSUS HARI:
#   special_monday:
#     enabled: true
#     reset-type: DAILY
#     day: MONDAY
#     display-name: "&b&lSenin Ceria"
#     item: "DIAMOND_BLOCK"
#     slot: 10
#     description:
#       - "&7Bonus khusus hari Senin!"
#     playtime-required: 60
#     lore:
#       cooldown: " &7Reset: %status%"
#       playtime: " &7Main: &7(%current%/%required%m)"
#     actions:
#       vanilla-items: ["DIAMOND_BLOCK:1"]
# 
# PANDUAN FORMAT ACTIONS:
# ------------------------------------------
# commands:
#   - "perintah console" (Mendukung PlaceholderAPI)
# 
# vanilla-items:
#   - "MATERIAL:JUMLAH:NAMA_CUSTOM"
#   Contoh: "DIAMOND:5-15:&bDiamond Hoki"
# 
# mmo-items:
#   - "TIPE:ID:JUMLAH"
# ------------------------------------------

rewards:
  daily:
    enabled: true
    reset-type: DAILY
    day: ALL
    display-name: "<gradient:#a8ff78:#78ffd6><bold>✦ Hadiah Harian ✦</bold></gradient>"
    item: "CHEST_MINECART"
    ready-item: "CHEST_MINECART"
    claimed-item: "HOPPER_MINECART"
    slot: 11
    description:
      - "&7Reset setiap Hari (Tengah malam)."
      - ""
      - "&7Hadiah:"
      - " &8- 1x <gradient:#FFE018:#FFFFFF:#FFE018>Bag of Gins</gradient>"
      - " &8- 1x <gradient:#A041FF:#414EFF>Item Protection Magic Jelly</gradient>"
      - " &8- 1x &7Rusty Key"
      - " &8- 1x &aMaterial Key"
    playtime-required: 30
    reset-message: "&aHadiah Harian telah reset"
    reset-sound: "ENTITY_EXPERIENCE_ORB_PICKUP;1.0;1.0"
    lore:
      cooldown: " &7Status Reset: %status%"
      playtime: " &7Waktu Main: %status%"
    actions:
      commands:
        - "phoenixc giveKey material %player% 1"
        - "phoenixc giveKey rusty %player% 1"
      mmo-items:
        - "CONSUMABLE:BAG_OF_GINS:1"
        - "ENCHANT:MAGIC_JELLY:1"
      messages:
        - "&aKamu menerima hadiah harian! Terima kasih sudah bermain."

  weekly:
    enabled: true
    reset-type: WEEKLY
    day: ALL
    display-name: "<gradient:#00d2ff:#3a7bd5><bold>✦ Hadiah Mingguan ✦</bold></gradient>"
    item: "HOPPER_MINECART"
    ready-item: "CHEST_MINECART"
    claimed-item: "HOPPER_MINECART"
    slot: 13
    description:
