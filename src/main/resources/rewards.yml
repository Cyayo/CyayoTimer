  monthly:
    enabled: true
    reset-type: MONTHLY
    day: ALL
    display-name: "<gradient:#ffaa00:#ffcc00><bold>✦ Hadiah Bulanan ✦</bold></gradient>"
    item: "MINECART"
    ready-item: "CHEST_MINECART"
    claimed-item: "HOPPER_MINECART"
    slot: 15
    description:
      - "&7Reset di setiap akhir bulan."
      - ""
      - "&7Hadiah:"
      - " &8- 5x <gradient:#FFE018:#FFFFFF:#FFE018>Bag of Gins</gradient>"
      - " &8- 4x <gradient:#740D91:#FF00E3:#E020E3>Bag of Runes</gradient>"
      - " &8- 1x <gradient:#870202:#FF00E3:#D50D0D>2x Luck 5m</gradient>"
      - " &8- 1x <gradient:#8B0000:#FF0000:#DC143C>2x Drop 5m</gradient>"
      - " &8- 1-2x &dRune Extractor"
      - " &8- 2-5x <gradient:#A041FF:#414EFF>Item Protection Magic Jelly</gradient>"
      - " &8- 1x &dCelestium Key"
